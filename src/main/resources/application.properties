spring.config.import=optional:file:.env[.properties]

spring.application.name=saas-backend

#database connection properties
# Database
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:5432/${DB_NAME}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate

# Flyway
spring.flyway.enabled=true
spring.flyway.user=${FLYWAY_USER}
spring.flyway.password=${FLYWAY_PASSWORD}

jwt.secret=${JWT_SECRET:CHANGE_ME_TO_A_LONG_RANDOM_BASE64_STRING_FOR_LOCAL_DEV_ONLY}
jwt.expiration-ms=3600000

stripe.secret-key=${STRIPE_SECRET_KEY:sk_test_placeholder}
stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET:whsec_placeholder}
stripe.checkout.success-url=${STRIPE_SUCCESS_URL:http://localhost:8080/billing/success}
stripe.checkout.cancel-url=${STRIPE_CANCEL_URL:http://localhost:8080/billing/cancel}